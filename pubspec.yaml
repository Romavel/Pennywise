name: pennywise
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    # Bundled so the app never fetches fonts at runtime (works offline).
    - assets/google_fonts/
    - assets/licenses/
