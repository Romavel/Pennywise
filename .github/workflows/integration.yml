name: Integration tests

# End-to-end flows on an Android emulator against the Firebase Emulator
# Suite (Auth + Firestore with the real security rules).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install -g firebase-tools@15

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The log is kept for the next step; job logs need a GitHub login,
          # annotations don't.
          script: firebase emulators:exec --only auth,firestore --project pennywise-5fa13 "flutter test integration_test --dart-define=USE_FIREBASE_EMULATORS=true" > integration.log 2>&1 || (cat integration.log; exit 1)

      - name: Summarise the failure
        if: failure()
        run: |
          [ -f integration.log ] || exit 0
          msg=$(grep -E "STEP:|Timed out|Expected:|Actual:|Which:|TestFailure|Exception|Error:|══╡" integration.log | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Integration test log::${msg}"
