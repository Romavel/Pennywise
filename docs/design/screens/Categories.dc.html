<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennywise — Categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C45}a:hover{color:#0A3530}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #12201E; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 48px 20px 28px">

<header style="display: flex; align-items: center; gap: 8px">
<a href="Settings.dc.html" aria-label="Back to settings" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #12201E; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<h1 style="margin: 0; flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Categories</h1>
</header>

<div role="group" aria-label="Category type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E3E9E7; border-radius: 14px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 11px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: {{t.shadow}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<ul style="list-style: none; margin: 0; padding: 0 16px; background: #FFFFFF; border-radius: 18px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<li style="border-top: {{r.divider}}">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; text-decoration: none; color: #12201E">
<span style="width: 36px; height: 36px; border-radius: 11px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg></span>
<span style="flex: 1; font-size: 15px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{r.tagFg}}; background: {{r.tagBg}}; border-radius: 999px; padding: 3px 8px">{{r.tag}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</li>
</sc-for>
</ul>

<p style="margin: 0; padding: 0 4px; font-size: 12px; color: #5B6663; line-height: 1.45">Default categories can be renamed but not deleted. Custom ones get their own icon and colour.</p>

<button style="margin-top: auto; height: 54px; border: 0; border-radius: 16px; background: #0F4C45; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New category</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var tab = (this.state && this.state.tab) || 'expense';
var I = {
food: 'M2 3h3l2.5 12h12L22 7H6M9 20.5h.01M18 20.5h.01',
transport: 'M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v11H4zM4 11h16M8 21v-4M16 21v-4',
housing: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
shopping: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2',
fun: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM10 8.5l5 3.5-5 3.5z',
health: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
education: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM19 19v2H6',
other: 'M5 12h.01M12 12h.01M19 12h.01',
coffee: 'M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2',
salary: 'M3 7h18v13H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18',
freelance: 'M4 5h16v11H4zM2 19h20',
investments: 'M3 17l6-6 4 4 8-8M15 7h6v6',
gift: 'M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-1.5-3-5-3-5-1s3 1 5 1c2 0 5 1 5-1s-3.5-2-5 1',
otherIncome: 'M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 3 5 3 5 1.1 5 3-2.2 3-5 3-5-1.1-5-3'
};
var expense = [
['food', 'Food & Groceries', '#FBE6D7', '#9A4A16', 0], ['transport', 'Transport', '#DDEBF3', '#245E80', 0],
['housing', 'Housing', '#DCE7EA', '#173F4F', 0], ['shopping', 'Shopping', '#FBF0D2', '#7A5B0E', 0],
['fun', 'Entertainment', '#ECE4F3', '#5B3F7A', 0], ['health', 'Health', '#F7E0E0', '#8E2F2F', 0],
['education', 'Education', '#E2E8F6', '#2E4A8A', 0], ['other', 'Other', '#E8ECEA', '#3F4A47', 0],
['coffee', 'Coffee', '#F1E4D6', '#6B4423', 1]
];
var income = [
['salary', 'Salary', '#DCEFE5', '#14613F', 0], ['freelance', 'Freelance', '#DCEFE5', '#14613F', 0],
['investments', 'Investments', '#DDEBF3', '#245E80', 0], ['otherIncome', 'Other Income', '#E8ECEA', '#3F4A47', 0],
['gift', 'Gifts', '#F7E0EC', '#8A2F5E', 1]
];
var rows = (tab === 'income' ? income : expense).map(function (r, i) {
var custom = r[4] === 1;
return { name: r[1], icon: I[r[0]], bg: r[2], fg: r[3], divider: i === 0 ? '0' : '1px solid #EDF1EF',
tag: custom ? 'Custom' : 'Default', tagBg: custom ? '#FBE6D7' : '#EDF1EF', tagFg: custom ? '#9A4A16' : '#5B6663' };
});
var tabs = [['expense', 'Expenses'], ['income', 'Income']].map(function (t) {
var on = t[0] === tab;
return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#12201E' : '#5B6663',
shadow: on ? '0 1px 3px rgba(18,32,30,0.12)' : 'none', pick: function () { self.setState({ tab: t[0] }); } };
});
return { tabs: tabs, rows: rows };
}
}
</script>
</body>
</html>
