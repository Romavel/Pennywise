<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennywise — Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C45}a:hover{color:#0A3530}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #12201E; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

<main style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 16px">

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Reports</h1>

<div role="group" aria-label="Period" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E3E9E7; border-radius: 14px; padding: 4px">
<sc-for list="{{periods}}" as="s" hint-placeholder-count="3">
<button aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="height: 40px; border: 0; border-radius: 11px; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: {{s.shadow}}; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #5B6663">Avg. monthly spend</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">PLN 4,150</span>
</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #5B6663">Spending vs September</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; color: #14613F; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>19%</span>
</div>
</div>

<section style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Income vs expenses</h2>
<div style="display: flex; gap: 12px; font-size: 12px; color: #5B6663">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0F4C45"></span>Income</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #E07B39"></span>Expenses</span>
</div>
</div>
<div role="img" aria-label="Income and expenses, May to October 2026, in thousands of PLN" style="display: flex; gap: 8px">
<div style="display: flex; flex-direction: column; justify-content: space-between; height: 128px; font-size: 10px; color: #5B6663; text-align: right; width: 22px; margin-top: -6px">
<span>9k</span><span>6k</span><span>3k</span><span>0</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="height: 120px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; background: linear-gradient(#EDF1EF 1px, transparent 1px) 0 0 / 100% 40px; border-bottom: 1px solid #C9D3CF">
<sc-for list="{{months}}" as="m" hint-placeholder-count="6">
<div style="display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%">
<div style="width: 12px; height: {{m.inc}}; border-radius: 4px 4px 0 0; background: #0F4C45"></div>
<div style="width: 12px; height: {{m.exp}}; border-radius: 4px 4px 0 0; background: #E07B39"></div>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: #5B6663; text-align: center">
<sc-for list="{{months}}" as="m" hint-placeholder-count="6"><span style="font-weight: {{m.weight}}; color: {{m.labelColor}}">{{m.label}}</span></sc-for>
</div>
</div>
</div>
</section>

<section style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Top spending categories</h2>
<span style="font-size: 12px; color: #5B6663">October</span>
</div>
<sc-for list="{{top}}" as="c" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px; font-variant-numeric: tabular-nums">
<span style="font-weight: 600">{{c.name}}</span>
<span><span style="font-weight: 700">{{c.amount}}</span> <span style="color: #5B6663">· {{c.share}}</span></span>
</div>
<div style="height: 8px; border-radius: 999px; background: #EDF1EF; overflow: hidden"><div style="width: {{c.barW}}; height: 100%; border-radius: 999px; background: {{c.color}}"></div></div>
</div>
</sc-for>
</section>

<section style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Budget history</h2>
<span style="font-size: 13px; color: #5B6663">Within budget 4 of 6 months</span>
</div>
<div role="img" aria-label="May to October: within, over, over, within, within, over" style="display: flex; gap: 6px">
<sc-for list="{{history}}" as="h" hint-placeholder-count="6">
<span style="width: 14px; height: 28px; border-radius: 5px; background: {{h.color}}"></span>
</sc-for>
</div>
</section>

</main>

<nav aria-label="Main" style="height: 76px; flex: none; background: #FFFFFF; border-top: 1px solid #E3E9E7; display: flex; align-items: stretch; padding: 0 6px 6px">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6663; font-size: 11px; font-weight: 500"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>Dashboard</a>
<a href="Transactions.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6663; font-size: 11px; font-weight: 500"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></span>Transactions</a>
<a href="Budgets.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6663; font-size: 11px; font-weight: 500"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg></span>Budgets</a>
<a href="Reports.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0F4C45; font-size: 11px; font-weight: 700"><span style="background: #DCEBE6; border-radius: 999px; padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M7 17v-5M12 17V6M17 17V9"/></svg></span>Reports</a>
<a href="Settings.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6663; font-size: 11px; font-weight: 500"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></span>Settings</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var period = (this.state && this.state.period) || '6m';
var periods = [['1m', 'Month'], ['6m', '6 months'], ['1y', 'Year']].map(function (s) {
var on = s[0] === period;
return { label: s[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#12201E' : '#5B6663',
shadow: on ? '0 1px 3px rgba(18,32,30,0.12)' : 'none', pick: function () { self.setState({ period: s[0] }); } };
});
var data = [['May', 7.2, 3.9], ['Jun', 7.2, 4.6], ['Jul', 8.4, 5.1], ['Aug', 7.2, 3.7], ['Sep', 7.9, 4.2], ['Oct', 8.2, 3.4]];
var months = data.map(function (d, i) {
var last = i === data.length - 1;
return { label: d[0], inc: Math.round(d[1] / 9 * 120) + 'px', exp: Math.round(d[2] / 9 * 120) + 'px',
weight: last ? '700' : '500', labelColor: last ? '#12201E' : '#5B6663' };
});
var top = [
['Housing', 'PLN 1,650.00', 48, '#173F4F'],
['Food & Groceries', 'PLN 842.60', 25, '#E07B39'],
['Transport', 'PLN 310.00', 9, '#5C9EC4'],
['Shopping', 'PLN 289.90', 9, '#D9A520']
].map(function (c) { return { name: c[0], amount: c[1], share: c[2] + '%', barW: Math.round(c[2] / 48 * 100) + '%', color: c[3] }; });
var history = [true, false, false, true, true, false].map(function (ok) { return { color: ok ? '#0F4C45' : '#E07B39' }; });
return { periods: periods, months: months, top: top, history: history };
}
}
</script>
</body>
</html>
