<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennywise — Add transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C45}a:hover{color:#0A3530}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #12201E; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 48px 20px 28px">

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #12201E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">{{title}}</h1>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<button aria-label="Delete transaction" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FDE7DC; color: #9A3412; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</sc-if>
<sc-if value="{{adding}}" hint-placeholder-val="{{ true }}">
<span style="width: 44px"></span>
</sc-if>
</header>

<div role="group" aria-label="Transaction type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E3E9E7; border-radius: 14px; padding: 4px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="2">
<button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 42px; border: 0; border-radius: 11px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: {{t.shadow}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0">
<span style="font-size: 13px; font-weight: 600; color: #5B6663">Amount</span>
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 500; color: #5B6663">PLN</span>
<input type="text" inputmode="decimal" value="{{amount}}" aria-invalid="{{showErrors}}" style="width: 190px; border: 0; outline: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -0.02em; color: {{amountColor}}; text-align: left; font-variant-numeric: tabular-nums">
</span>
<sc-if value="{{showErrors}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 600; color: #B23F0E">Enter an amount greater than 0.</span>
</sc-if>
</label>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600">Category</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<button aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 74px; border-radius: 16px; border: 2px solid {{c.border}}; background: #FFFFFF; color: #12201E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 2px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 10px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg></span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{c.short}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{showErrors}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 600; color: #B23F0E">Choose a category.</span>
</sc-if>
</fieldset>

<div style="background: #FFFFFF; border-radius: 16px; padding: 0 16px">
<button style="width: 100%; min-height: 56px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #12201E; cursor: pointer; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6663" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #5B6663">Date</span><span style="font-size: 15px; font-weight: 600">Today, 11 Oct 2026</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</button>
<label style="min-height: 56px; border-top: 1px solid #EDF1EF; display: flex; align-items: center; gap: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6663" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Note (optional)</span>
<input type="text" placeholder="Add a note (optional)" value="{{note}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #12201E">
</label>
</div>

<a href="Main.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #0F4C45; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["add","edit"],"default":"add"},"showErrors":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var mode = this.props.mode ?? 'add';
var showErrors = this.props.showErrors ?? false;
var editing = mode === 'edit';
var s = this.state || {};
var type = s.type || 'expense';
var I = {
food: 'M2 3h3l2.5 12h12L22 7H6M9 20.5h.01M18 20.5h.01',
transport: 'M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v11H4zM4 11h16M8 21v-4M16 21v-4',
housing: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
shopping: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2',
fun: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM10 8.5l5 3.5-5 3.5z',
health: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
education: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM19 19v2H6',
other: 'M5 12h.01M12 12h.01M19 12h.01',
salary: 'M3 7h18v13H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18',
freelance: 'M4 5h16v11H4zM2 19h20',
investments: 'M3 17l6-6 4 4 8-8M15 7h6v6',
otherIncome: 'M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 3 5 3 5 1.1 5 3-2.2 3-5 3-5-1.1-5-3'
};
var expense = [
['food', 'Food', '#FBE6D7', '#9A4A16'], ['transport', 'Transport', '#DDEBF3', '#245E80'],
['housing', 'Housing', '#DCE7EA', '#173F4F'], ['shopping', 'Shopping', '#FBF0D2', '#7A5B0E'],
['fun', 'Fun', '#ECE4F3', '#5B3F7A'], ['health', 'Health', '#F7E0E0', '#8E2F2F'],
['education', 'Education', '#E2E8F6', '#2E4A8A'], ['other', 'Other', '#E8ECEA', '#3F4A47']
];
var income = [
['salary', 'Salary', '#DCEFE5', '#14613F'], ['freelance', 'Freelance', '#DCEFE5', '#14613F'],
['investments', 'Investing', '#DDEBF3', '#245E80'], ['otherIncome', 'Other', '#E8ECEA', '#3F4A47']
];
var list = type === 'income' ? income : expense;
var picked = showErrors ? null : (s.cat || (type === 'income' ? 'salary' : 'food'));
var cats = list.map(function (c) {
var on = c[0] === picked;
return { short: c[1], icon: I[c[0]], bg: c[2], fg: c[3], pressed: on ? 'true' : 'false',
border: on ? '#0F4C45' : '#FFFFFF', pick: function () { self.setState({ cat: c[0] }); } };
});
var types = [['expense', 'Expense'], ['income', 'Income']].map(function (t) {
var on = t[0] === type;
return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#12201E' : '#5B6663',
shadow: on ? '0 1px 3px rgba(18,32,30,0.12)' : 'none', pick: function () { self.setState({ type: t[0], cat: null }); } };
});
return {
types: types, cats: cats, editing: editing, adding: !editing, showErrors: showErrors,
title: editing ? 'Edit transaction' : 'New transaction',
cta: editing ? 'Save changes' : 'Add transaction',
amount: showErrors ? '0.00' : (editing ? '86.40' : '45.99'),
amountColor: showErrors ? '#B23F0E' : (type === 'income' ? '#14613F' : '#12201E'),
note: editing ? 'Weekly groceries' : ''
};
}
}
</script>
</body>
</html>
