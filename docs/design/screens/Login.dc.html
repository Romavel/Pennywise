<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pennywise — Log in or sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F4C45}a:hover{color:#0A3530}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #12201E; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 72px 24px 32px">

<div style="display: flex; flex-direction: column; gap: 18px">
<div style="width: 56px; height: 56px; border-radius: 18px; background: #E07B39; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 48 48" fill="none" aria-hidden="true">
<ellipse cx="24" cy="14" rx="14" ry="5.5" stroke="#1B0E05" stroke-width="3.6"/>
<path d="M10 14v10c0 3 6.3 5.5 14 5.5S38 27 38 24V14" stroke="#1B0E05" stroke-width="3.6" stroke-linecap="round"/>
<path d="M10 24v10c0 3 6.3 5.5 14 5.5S38 37 38 34V24" stroke="#1B0E05" stroke-width="3.6" stroke-linecap="round"/>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">{{heading}}</h1>
<p style="margin: 0; font-size: 15px; color: #5B6663; line-height: 1.45">{{sub}}</p>
</div>
</div>

<div role="group" aria-label="Log in or sign up" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E3E9E7; border-radius: 14px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 42px; border: 0; border-radius: 11px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: {{t.shadow}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; align-items: flex-start; gap: 10px; background: #FDE7DC; color: #9A3412; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/></svg>
<span>That email and password don’t match. Check them and try again.</span>
</div>
</sc-if>

<form style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{signup}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Display name
<input type="text" value="Jakub" autocomplete="nickname" style="height: 52px; box-sizing: border-box; border: 1px solid #D3DCD9; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 400; color: #12201E">
</label>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Email
<input type="email" placeholder="you@example.com" autocomplete="email" style="height: 52px; box-sizing: border-box; border: 1px solid {{emailBorder}}; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 400; color: #12201E">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Password
<span style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #D3DCD9; border-radius: 14px; background: #FFFFFF; padding: 0 4px 0 16px">
<input type="password" value="password123" autocomplete="current-password" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 400; color: #12201E">
<button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5B6663; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</span>
</label>
<sc-if value="{{signup}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #5B6663">At least 8 characters.</span>
</sc-if>
<sc-if value="{{login}}" hint-placeholder-val="{{ true }}">
<a href="#" style="align-self: flex-end; font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 0">Forgot password?</a>
</sc-if>
</form>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: center">
<a href="Main.dc.html" style="width: 100%; height: 54px; border-radius: 16px; background: #0F4C45; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}</a>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B6663"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Your data stays private and syncs across devices.</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showError":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var mode = (this.state && this.state.mode) || 'login';
var signup = mode === 'signup';
var showError = this.props.showError ?? false;
var tabs = [['login', 'Log in'], ['signup', 'Sign up']].map(function (t) {
var on = t[0] === mode;
return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#12201E' : '#5B6663',
shadow: on ? '0 1px 3px rgba(18,32,30,0.12)' : 'none', pick: function () { self.setState({ mode: t[0] }); } };
});
return {
tabs: tabs, signup: signup, login: !signup, showError: showError,
emailBorder: showError ? '#C2410C' : '#D3DCD9',
heading: signup ? 'Create your account' : 'Welcome back',
sub: signup ? 'Track income, expenses and budgets in one place.' : 'Log in to see your balance and budgets.',
cta: signup ? 'Create account' : 'Log in'
};
}
}
</script>
</body>
</html>
